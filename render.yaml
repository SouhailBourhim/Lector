services:
  - type: web
    name: lector
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: /data
      - key: N_WORKERS
        value: "4"
      - key: TTS_CONCURRENCY
        value: "10"
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: MAX_GLOBAL_JOBS
        value: "10"
    disk:
      name: lector-data
      mountPath: /data
      sizeGB: 10
