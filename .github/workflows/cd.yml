name: CD

on:
  push:
    branches: [main]

jobs:
  # ── 1. Build + push image to GHCR ────────────────────────────────────────────
  push-image:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # built-in, no extra setup

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-    # e.g. sha-a1b2c3d  (immutable, for rollback)
            type=raw,value=latest   # always points to the newest main build

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Deploy to Railway ──────────────────────────────────────────────────────
  # Skips cleanly when RAILWAY_TOKEN secret is not set.
  # To enable: Settings → Secrets → New secret → RAILWAY_TOKEN
  deploy-railway:
    name: Deploy → Railway
    runs-on: ubuntu-latest
    needs: push-image
    if: ${{ vars.RAILWAY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        run: railway up --detach --service lector
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ── 3. Deploy to Render ───────────────────────────────────────────────────────
  # Skips cleanly when RENDER_DEPLOY_HOOK secret is not set.
  # To enable: Settings → Secrets → New secret → RENDER_DEPLOY_HOOK
  #   (value = the Deploy Hook URL from Render dashboard → Service → Settings)
  deploy-render:
    name: Deploy → Render
    runs-on: ubuntu-latest
    needs: push-image
    if: ${{ vars.RENDER_ENABLED == 'true' }}
    steps:
      - name: Trigger Render deploy hook
        run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
