name: CD

on:
  push:
    branches: [main]

jobs:
  # ── 1. Build + push image to GHCR ────────────────────────────────────────────
  push-image:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # built-in, no extra setup

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-    # e.g. sha-a1b2c3d  (immutable, for rollback)
            type=raw,value=latest   # always points to the newest main build

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Deploy to Railway ──────────────────────────────────────────────────────
  # Gated on a repository *variable* (not a secret) because GitHub Actions
  # does not allow secrets in job-level `if` expressions.
  # To enable:
  #   Settings → Variables → New variable → RAILWAY_ENABLED = true
  #   Settings → Secrets  → New secret  → RAILWAY_TOKEN = <your token>
  # The job is skipped when RAILWAY_ENABLED != 'true'; it fails if the
  # variable is set but RAILWAY_TOKEN secret is missing.
  deploy-railway:
    name: Deploy → Railway
    runs-on: ubuntu-latest
    needs: push-image
    if: ${{ vars.RAILWAY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        run: railway up --detach --service lector
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ── 3. Deploy to Render ───────────────────────────────────────────────────────
  # Same pattern: gated on RENDER_ENABLED variable; also requires
  # RENDER_DEPLOY_HOOK secret (deploy hook URL from Render dashboard →
  # Service → Settings). Job is skipped when variable is absent/false;
  # fails if variable is set but secret is missing.
  deploy-render:
    name: Deploy → Render
    runs-on: ubuntu-latest
    needs: push-image
    if: ${{ vars.RENDER_ENABLED == 'true' }}
    steps:
      - name: Trigger Render deploy hook
        run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
