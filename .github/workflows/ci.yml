name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Check
        run: ruff check .

  # ── 2. Docker build + smoke test ─────────────────────────────────────────────
  build-and-smoke:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: lector:ci
          # Reuse layer cache between runs — cuts cold build from ~4 min to ~45 s
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Load into local daemon so we can run the container
          load: true

      - name: Smoke — /health returns 200
        run: |
          docker run -d --name lector-smoke \
            -p 8000:8000 \
            -e DATA_DIR=/tmp/lector_data \
            lector:ci

          echo "Waiting for server startup…"
          for i in $(seq 1 15); do
            sleep 2
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "000")
            if [ "$HTTP" = "200" ]; then
              echo "✓ /health → 200"
              exit 0
            fi
            echo "  attempt $i: HTTP $HTTP"
          done

          echo "✗ Health check timed out after 30 s"
          docker logs lector-smoke
          exit 1

      - name: Smoke — /voices returns 8 voices
        run: |
          COUNT=$(curl -s http://localhost:8000/voices \
            | python3 -c "import sys, json; print(len(json.load(sys.stdin)))")
          if [ "$COUNT" = "8" ]; then
            echo "✓ /voices → $COUNT voices"
          else
            echo "✗ Expected 8 voices, got $COUNT"
            exit 1
          fi

      - name: Dump logs on failure
        if: failure()
        run: docker logs lector-smoke || true
